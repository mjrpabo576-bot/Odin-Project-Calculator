<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple calculator with four basic operations, decimals, Backspace, and keyboard support.">
    <title>Calculator | The Odin Project</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c2d43'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='%23ff9a50' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="heading">
        <h1>Calculator</h1>
      </header>

      <section class="calculator" aria-label="Calculator">
        <div class="screen">
          <p id="expression" class="expression" aria-label="Current calculation"></p>
          <output id="display" class="display" aria-label="Calculator display" aria-live="polite" aria-atomic="true">0</output>
        </div>
        <p id="message" class="message" role="status"></p>

        <div class="keypad">
          <button class="key utility wide" data-action="clear" type="button">Clear</button>
          <button class="key utility" data-action="backspace" type="button" aria-label="Backspace">⌫</button>
          <button class="key operator" data-action="operator" data-value="/" type="button" aria-label="Divide" aria-pressed="false">÷</button>

          <button class="key" data-action="digit" data-value="7" type="button">7</button>
          <button class="key" data-action="digit" data-value="8" type="button">8</button>
          <button class="key" data-action="digit" data-value="9" type="button">9</button>
          <button class="key operator" data-action="operator" data-value="*" type="button" aria-label="Multiply" aria-pressed="false">×</button>

          <button class="key" data-action="digit" data-value="4" type="button">4</button>
          <button class="key" data-action="digit" data-value="5" type="button">5</button>
          <button class="key" data-action="digit" data-value="6" type="button">6</button>
          <button class="key operator" data-action="operator" data-value="-" type="button" aria-label="Subtract" aria-pressed="false">−</button>

          <button class="key" data-action="digit" data-value="1" type="button">1</button>
          <button class="key" data-action="digit" data-value="2" type="button">2</button>
          <button class="key" data-action="digit" data-value="3" type="button">3</button>
          <button class="key operator" data-action="operator" data-value="+" type="button" aria-label="Add" aria-pressed="false">+</button>

          <button class="key wide" data-action="digit" data-value="0" type="button">0</button>
          <button id="decimal" class="key" data-action="decimal" type="button" aria-label="Decimal point">.</button>
          <button class="key equals" data-action="equals" type="button" aria-label="Equals">=</button>
        </div>
      </section>

      <p class="keyboard-help">Keyboard: <kbd>0–9</kbd> <kbd>+ − * /</kbd><br><kbd>Enter</kbd> equals · <kbd>Backspace</kbd> deletes · <kbd>Esc</kbd> clears</p>
    </main>
  </body>
</html>
